services:
  app:
    build: ./app
    image: scanny:latest
    container_name: scanny
    restart: unless-stopped
    environment:
      - TZ=Europe/London
      - DATABASE_URL=sqlite+aiosqlite:////data/scanny.db
    env_file:
      - .env
    ports:
      - "9841:8000"
    volumes:
      - ./secrets:/secrets:ro
      - ./data:/data
    networks:
      - media-stack_otis_net

networks:
  media-stack_otis_net:
    external: true
