{% extends "base.html" %}
{% set active = 'tasks' %}
{% block title %}Tasks — Scanny{% endblock %}
{% block content %}

<p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-4">Tasks</p>

<!-- Broken links -->
<div class="mb-6">
  <div class="flex items-center justify-between mb-3">
    <p class="text-sm font-semibold text-gray-700">Broken links</p>
    {% if not scan_state.running %}
    <button
      hx-post="/tasks/check-broken-links"
      hx-target="#broken-links-section"
      hx-swap="innerHTML"
      class="text-xs text-blue-500 font-medium active:opacity-60 transition-opacity">
      Scan now
    </button>
    {% endif %}
  </div>
  <div id="broken-links-section">
    {% include "_broken_links.html" %}
  </div>
</div>

<!-- Re-link moved files -->
<div class="mb-6">
  <p class="text-sm font-semibold text-gray-700 mb-3">Re-link moved files</p>
  <div id="relink-section">
    {% include "_relink.html" %}
  </div>
</div>

{% endblock %}
