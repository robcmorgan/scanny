{% if quick_pairs %}
<div class="space-y-2 mb-4">
  {% for sub in quick_pairs %}
  <button data-move-chip
    onclick="selectMoveTarget(this, '{{ sub.id }}')"
    class="{{ chip_color(sub.group.name) }} w-full text-left rounded-2xl px-4 py-3 active:scale-95 transition-transform block">
    <span class="text-xs opacity-60 block">{{ sub.group.name }}</span>
    <span class="font-semibold">{% if sub.name != '/' %}{{ sub.name }}{% else %}{{ sub.group.name }}{% endif %}</span>
  </button>
  {% endfor %}
</div>
<p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">All groups</p>
{% endif %}

<div class="grid grid-cols-2 gap-2 pb-4">
  {% for group in all_groups %}
  <button type="button"
    hx-get="/document/{{ document_id }}/move-subgroups?group_id={{ group.id }}"
    hx-target="#move-modal-body"
    hx-swap="innerHTML"
    class="{{ chip_color(group.name) }} rounded-2xl px-3 py-2.5 text-sm font-semibold text-left active:scale-95 transition-transform">
    {{ group.name }}
  </button>
  {% endfor %}
</div>
