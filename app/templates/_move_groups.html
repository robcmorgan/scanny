<div class="grid grid-cols-2 gap-3 pb-2">

  <!-- Left: all groups -->
  <div>
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2 px-1">Groups</p>
    <div class="space-y-1.5">
      {% for group in all_groups %}
      <button type="button"
        hx-get="/document/{{ document_id }}/move-subgroups?group_id={{ group.id }}"
        hx-target="#move-modal-body"
        hx-swap="innerHTML"
        class="{{ chip_color(group.name) }} w-full text-left rounded-2xl px-4 py-3.5 font-semibold shadow-sm active:scale-95 transition-transform">
        {{ group.name }}
      </button>
      {% endfor %}
    </div>
  </div>

  <!-- Right: last used pairs -->
  <div>
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2 px-1">Last used</p>
    <div class="space-y-1.5">
      {% for sub in quick_pairs %}
      <button data-move-chip
        onclick="selectMoveTarget(this, '{{ sub.id }}')"
        class="{{ chip_color(sub.group.name + '/' + sub.name) }} w-full text-left rounded-2xl px-4 py-3.5 shadow-sm active:scale-95 transition-transform block">
        <span class="text-xs opacity-60 block leading-tight">{{ sub.group.name }}</span>
        <span class="font-semibold leading-snug">{% if sub.name != '/' %}{{ sub.name }}{% else %}{{ sub.group.name }}{% endif %}</span>
      </button>
      {% endfor %}
      {% if not quick_pairs %}
      <p class="text-xs text-gray-300 px-1 pt-1">Recent picks appear here</p>
      {% endif %}
    </div>
  </div>

</div>
