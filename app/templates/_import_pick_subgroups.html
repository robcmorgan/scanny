<div id="card-{{ file_id }}" class="bg-white rounded-2xl shadow-sm col-span-2">
  <div class="px-3 pt-3 pb-3">
    <div class="flex items-center gap-2 mb-3">
      <button type="button"
        hx-get="/import/{{ file_id }}/pick"
        hx-target="#card-{{ file_id }}"
        hx-swap="outerHTML"
        class="flex items-center gap-1 text-sm text-gray-400 active:opacity-60">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        Groups
      </button>
      <p class="text-sm font-semibold text-gray-700 flex-1">{{ group.name }}</p>
      <button
        hx-get="/import/{{ file_id }}/card"
        hx-target="#card-{{ file_id }}"
        hx-swap="outerHTML"
        class="text-xs text-gray-400 active:opacity-60">Cancel</button>
    </div>

    {% if slash_sub %}
    <button
      hx-post="/import/{{ file_id }}/file"
      hx-target="#card-{{ file_id }}"
      hx-swap="outerHTML"
      hx-vals='{"subgroup_id": "{{ slash_sub.id }}"}'
      class="{{ chip_color(group.name) }} w-2/3 text-left font-medium ring-2 ring-inset ring-black/25 rounded-xl px-3 py-2 mb-2 active:scale-95 transition-transform block">
      {{ group.name }}
    </button>
    {% endif %}

    <div class="space-y-2">
      {% for sub in subgroups %}
      <button
        hx-post="/import/{{ file_id }}/file"
        hx-target="#card-{{ file_id }}"
        hx-swap="outerHTML"
        hx-vals='{"subgroup_id": "{{ sub.id }}"}'
        class="w-full text-left rounded-xl active:scale-95 transition-transform overflow-hidden block {{ chip_color(group.name + '/' + sub.name) }}">
        <span class="block px-3 pt-2 pb-0.5">
          <span class="inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full {{ chip_color(group.name) }}">
            <svg class="w-2.5 h-2.5 opacity-70 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z"/>
            </svg>
            {{ group.name }}
          </span>
        </span>
        <span class="font-semibold block px-3 pb-2.5">{{ sub.name }}</span>
      </button>
      {% endfor %}
      {% if not subgroups and not slash_sub %}
      <p class="text-sm text-gray-400 text-center py-2">No subgroups</p>
      {% endif %}
    </div>
  </div>
</div>
