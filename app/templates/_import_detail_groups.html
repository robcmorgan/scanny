<div class="grid grid-cols-2 gap-3">

  <!-- Left: groups with A-Z scroll-switch -->
  <div data-groups-area="">

    <!-- Normal view: trimmed + filled -->
    <div data-view="normal">
      <button onclick="toggleGroupsAZ(this)"
        class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2 px-1 flex items-center gap-1 active:opacity-60">
        Groups
        <svg class="w-3 h-3 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7h18M7 12h10M11 17h2"/>
        </svg>
      </button>
      <div id="import-groups-col">
        {% for group in groups %}
        <button type="button"
          hx-get="/import/{{ file_id }}/detail-groups?group_id={{ group.id }}"
          hx-target="#picker-section"
          hx-swap="innerHTML"
          class="{{ chip_color(group.name) }} w-full text-left rounded-2xl px-4 py-3.5 font-semibold shadow-sm active:scale-95 transition-transform">
          {{ group.name }}
        </button>
        {% endfor %}
      </div>
      <div class="flex justify-center mt-2"><div class="w-6 h-1 bg-gray-200 rounded-full"></div></div>
    </div>

    <!-- A-Z view: scrollable -->
    <div data-view="az" class="hidden">
      <button onclick="toggleGroupsAZ(this)"
        class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2 px-1 flex items-center gap-1 active:opacity-60">
        A-Z
        <svg class="w-3 h-3 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
        </svg>
      </button>
      <div id="import-groups-col-az" class="space-y-1.5 overflow-y-auto">
        {% for group in groups %}
        <button type="button"
          hx-get="/import/{{ file_id }}/detail-groups?group_id={{ group.id }}"
          hx-target="#picker-section"
          hx-swap="innerHTML"
          class="{{ chip_color(group.name) }} w-full text-left rounded-xl px-3 py-2 text-sm font-medium active:scale-95 transition-transform">
          {{ group.name }}
        </button>
        {% endfor %}
      </div>
      <div class="flex justify-center mt-2"><div class="w-6 h-1 bg-gray-200 rounded-full"></div></div>
    </div>

  </div>

  <!-- Right: recent pairs -->
  <div>
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2 px-1">Last used</p>
    <div id="import-pairs-col">
      {% for sub in quick_pairs %}
      <button type="button"
        hx-get="/import/{{ file_id }}/confirm?subgroup_id={{ sub.id }}"
        hx-target="#picker-section"
        hx-swap="innerHTML"
        class="{{ chip_color(sub.group.name + '/' + sub.name) }} w-full text-left rounded-2xl px-4 py-3.5 shadow-sm active:scale-95 transition-transform">
        <span class="text-xs opacity-60 block leading-tight">{{ sub.group.name }}</span>
        <span class="text-sm font-semibold leading-snug">{% if sub.name != '/' %}{{ sub.name }}{% else %}{{ sub.group.name }}{% endif %}</span>
      </button>
      {% endfor %}
      {% if not quick_pairs %}
      <p class="text-xs text-gray-300 px-1 pt-1">Recent picks appear here</p>
      {% endif %}
    </div>
  </div>

</div>

<script>
(function() {
  if (window.innerWidth >= 640) return; // desktop: let columns flow naturally
  var fileCard = document.querySelector('[data-file-card]');
  var fileH = fileCard ? fileCard.offsetHeight + 20 : 0;
  var available = window.innerHeight - 64 - 20 - fileH - 8;

  var azEl = document.getElementById('import-groups-col-az');
  if (azEl) azEl.style.maxHeight = (available - 56) + 'px';

  function fillCol(colId) {
    var col = document.getElementById(colId);
    if (!col) return;
    var items = Array.from(col.children);
    var gap = 8, colH = available - 28;
    items.forEach(function(el) { el.style.flex=''; el.style.display=''; el.style.marginTop='0'; });
    col.style.cssText = '';
    var used = 0, visCount = 0;
    items.forEach(function(el, i) {
      var h = el.offsetHeight + (i > 0 ? gap : 0);
      if (used + h <= colH) { used += h; visCount++; }
      else el.style.display = 'none';
    });
    col.style.cssText = 'display:flex;flex-direction:column;gap:' + gap + 'px;height:' + colH + 'px;';
    items.slice(0, visCount).forEach(function(el) {
      el.style.flex = '1';
      el.style.display = 'flex';
      el.style.flexDirection = 'column';
      el.style.justifyContent = 'center';
    });
  }

  fillCol('import-groups-col');
  fillCol('import-pairs-col');

  // Re-init pull gesture for newly rendered area
  document.querySelectorAll('[data-groups-area]').forEach(function(a) {
    if (typeof initGroupsPull === 'function') initGroupsPull(a);
  });
})();
</script>
