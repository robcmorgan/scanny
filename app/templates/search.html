{% extends "base.html" %}
{% set active = 'search' %}
{% block title %}Search — Scanny{% endblock %}
{% block content %}

<p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-4">Search</p>

<input id="search-input" type="search" autofocus
  placeholder="Name, description, category…"
  class="w-full bg-white rounded-2xl px-4 py-3.5 text-base shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 mb-4"
  hx-get="/search/results"
  hx-trigger="input changed delay:200ms, search"
  hx-target="#search-results"
  name="q"
  autocomplete="off">

<div id="search-results">
  <p class="text-center text-gray-300 text-sm py-8">Start typing to search</p>
</div>

{% endblock %}
