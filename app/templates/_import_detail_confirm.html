<div class="flex items-center gap-2 mb-4">
  <!-- X cancel → back to picker -->
  <button type="button"
    hx-get="/import/{{ file_id }}/detail-groups"
    hx-target="#picker-section"
    hx-swap="innerHTML"
    class="w-11 h-11 flex items-center justify-center text-gray-400 active:opacity-60 shrink-0 -ml-1">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>
  <!-- Subgroup chip -->
  <div class="{{ chip_color(color_key) }} flex-1 rounded-2xl px-4 py-2.5 min-w-0">
    <span class="text-xs opacity-60 block leading-tight">{{ group.name }}</span>
    <span class="font-semibold leading-snug">{{ subgroup_label }}</span>
  </div>
  <!-- Save submit -->
  <button type="submit" form="import-confirm-form" id="import-submit-btn"
    class="w-11 h-11 bg-blue-600 active:bg-blue-700 text-white rounded-2xl flex items-center justify-center shadow-sm shrink-0">
    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7l-4-4z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M17 3v4a1 1 0 01-1 1H8a1 1 0 01-1-1V3"/>
      <rect x="9" y="14" width="6" height="5" rx="0.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<form id="import-confirm-form" action="/import/{{ file_id }}/file" method="post">
  <input type="hidden" name="subgroup_id" value="{{ subgroup.id }}">
  <input type="hidden" name="from_detail" value="1">
  <input type="hidden" name="drive_filename" value="{{ drive_filename }}">
  <input type="hidden" name="source_folder_id" value="{{ source_folder_id }}">
  <input type="hidden" name="scan_time_str" value="{{ scan_time_str }}">

  <!-- Filename preview -->
  <div class="bg-white rounded-2xl px-4 py-3 mb-4 shadow-sm">
    <p class="text-xs text-gray-400 mb-1">Filename</p>
    <p id="import-fn-preview" class="font-mono text-xs text-gray-700 break-all"></p>
  </div>

  <div class="space-y-3">

    <div>
      <input type="text" name="item_one_off_description" id="import-one-off"
        value="{{ filename_prefix }}"
        oninput="importSyncOneOff()"
        class="w-full bg-white rounded-2xl px-4 py-3.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
        placeholder="One-off description (optional)">
      {% if scan_date_str %}
      <div class="flex items-center gap-2 mt-1.5 px-1">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" id="import-date-chk" class="w-4 h-4 accent-blue-500">
          <span class="text-xs text-gray-500">Add date to filename</span>
        </label>
        <input type="date" name="scan_date_str" id="import-scan-date" value="{{ scan_date_str }}" required
          class="ml-auto text-xs text-gray-500 bg-transparent border-0 p-0 focus:outline-none focus:ring-0">
      </div>
      {% endif %}
    </div>

    <textarea name="comment" rows="2"
      class="w-full bg-white rounded-2xl px-4 py-3.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"
      placeholder="Notes"></textarea>

    <div class="bg-white rounded-2xl px-4 py-3.5 shadow-sm">
      <div class="flex gap-6 flex-wrap">
        <label class="flex items-center gap-2.5 cursor-pointer">
          <input type="checkbox" name="rob_task" value="1" id="import-rob-todo" onchange="importToggleTodo()"
            class="w-5 h-5 rounded accent-orange-500">
          <span class="text-sm font-medium text-gray-700">Rob to-do</span>
        </label>
        <label class="flex items-center gap-2.5 cursor-pointer">
          <input type="checkbox" name="beccy_task" value="1" id="import-beccy-todo" onchange="importToggleTodo()"
            class="w-5 h-5 rounded accent-pink-500">
          <span class="text-sm font-medium text-gray-700">Beccy to-do</span>
        </label>
        <label class="flex items-center gap-2.5 cursor-pointer">
          <input type="checkbox" name="photo_quality" value="1"
            class="w-5 h-5 rounded accent-sky-500">
          <span class="flex items-center gap-1 text-sm font-medium text-gray-700">
            <svg class="w-4 h-4 text-sky-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            Photo
          </span>
        </label>
      </div>
      <div id="import-todo-note" class="hidden mt-3">
        <input type="text" name="task_note"
          class="w-full bg-orange-50 border border-orange-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
          placeholder="What needs doing?">
      </div>
    </div>

    <input type="text" name="override_filename" id="import-override"
      oninput="importOverrideManual=this.value.length>0; importUpdatePreview()"
      class="w-full bg-white rounded-2xl px-4 py-3.5 text-sm font-mono shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400"
      placeholder="Filename override (optional)">

  </div>
</form>

<!-- Delete from Drive -->
<form action="/import/{{ file_id }}/delete-from-drive" method="post" class="mt-4"
      onsubmit="return confirm('Move this file to Drive trash?')">
  <button type="submit"
    class="w-full bg-white text-red-500 border border-red-100 rounded-2xl py-3 text-sm font-medium active:bg-red-50 shadow-sm">
    Delete from Drive
  </button>
</form>

<script>
(function() {
  var driveFilename = {{ drive_filename | tojson }};
  var filenameTag   = {{ filename_tag | tojson }};
  var subgroupLabel = {{ subgroup_label | tojson }};
  var scanDate      = {{ scan_date_str | tojson }};
  var scanTime      = {{ scan_time_str | tojson }};
  var fileId        = {{ file_id | tojson }};
  var extMatch = driveFilename.match(/\.([^.]+)$/);
  var ext = extMatch ? extMatch[1] : 'pdf';
  window.importOverrideManual = false;

  // Preserve typed notes/override/tasks across group/subgroup navigation (X cancel + re-pick),
  // since each pick re-renders this partial from scratch and would otherwise wipe them out.
  var storageKey = 'scanny-import-draft:' + fileId;
  var draftTextFields = ['item_one_off_description', 'comment', 'override_filename', 'task_note', 'scan_date_str'];
  var draftCheckboxes = ['rob_task', 'beccy_task', 'photo_quality'];
  var form = document.getElementById('import-confirm-form');

  function saveDraft() {
    var data = {};
    draftTextFields.forEach(function(name) {
      var el = form.querySelector('[name="' + name + '"]');
      if (el) data[name] = el.value;
    });
    draftCheckboxes.forEach(function(name) {
      var el = form.querySelector('[name="' + name + '"]');
      if (el) data[name] = el.checked;
    });
    sessionStorage.setItem(storageKey, JSON.stringify(data));
  }

  function restoreDraft() {
    var raw = sessionStorage.getItem(storageKey);
    if (!raw) return;
    var data;
    try { data = JSON.parse(raw); } catch (e) { return; }
    draftTextFields.forEach(function(name) {
      if (data[name] === undefined) return;
      var el = form.querySelector('[name="' + name + '"]');
      if (el) el.value = data[name];
    });
    draftCheckboxes.forEach(function(name) {
      if (data[name] === undefined) return;
      var el = form.querySelector('[name="' + name + '"]');
      if (el) el.checked = data[name];
    });
    if (data.override_filename) window.importOverrideManual = true;
  }

  restoreDraft();
  form.addEventListener('input', saveDraft);
  form.addEventListener('change', saveDraft);
  form.addEventListener('submit', function() {
    sessionStorage.removeItem(storageKey);
  });

  window.importSyncOneOff = function() {
    if (!importOverrideManual) {
      document.getElementById('import-override').value = document.getElementById('import-one-off').value;
    }
    importUpdatePreview();
  };

  window.importUpdatePreview = function() {
    var override = document.getElementById('import-override').value.trim();
    var preview = document.getElementById('import-fn-preview');
    if (!preview) return;
    if (override) {
      preview.textContent = override.replace(/\.[^.]+$/, '') + '.' + ext;
      return;
    }
    var dateInp = document.getElementById('import-scan-date');
    var label = filenameTag || subgroupLabel;
    preview.textContent = (dateInp ? dateInp.value : scanDate) + ' ' + label + ' scanned papers-' + scanTime + '.' + ext;
  };

  window.importToggleTodo = function() {
    var either = document.getElementById('import-rob-todo').checked || document.getElementById('import-beccy-todo').checked;
    document.getElementById('import-todo-note').classList.toggle('hidden', !either);
  };

  importUpdatePreview();
  importToggleTodo();
  datePrefix('import-date-chk', 'import-one-off', 'import-scan-date');
  var scanDateInp = document.getElementById('import-scan-date');
  if (scanDateInp) scanDateInp.addEventListener('input', importUpdatePreview);
  if (document.getElementById('import-one-off').value) importSyncOneOff();

  // Focus the save button so Enter submits immediately
  var submitBtn = document.getElementById('import-submit-btn');
  var oneOff = document.getElementById('import-one-off');
  setTimeout(function() { if (submitBtn) submitBtn.focus(); }, 50);

  // Typing any printable character redirects focus to the description field
  document.addEventListener('keydown', function onConfirmKey(e) {
    // Clean up listener if this partial is swapped out
    if (!document.getElementById('import-submit-btn')) {
      document.removeEventListener('keydown', onConfirmKey);
      return;
    }
    var active = document.activeElement;
    var inInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
    if (!inInput && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
      oneOff.focus();
      // character flows naturally into the now-focused input
    }
  });
})();
</script>
