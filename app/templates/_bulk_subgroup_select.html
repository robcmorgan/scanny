<select name="subgroup_id" required
  class="w-full bg-white rounded-2xl px-4 py-3.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-400">
  <option value="" disabled selected>Subgroup…</option>
  {% for sub in subgroups %}
  <option value="{{ sub.id }}">{% if sub.name != '/' %}{{ sub.name }}{% else %}(default){% endif %}</option>
  {% endfor %}
</select>
