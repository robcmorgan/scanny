{% extends "base.html" %}
{% from "_macros.html" import alpha_bg %}
{% set active = 'library' %}
{% block title %}Library — Scanny{% endblock %}
{% block content %}

<p class="text-xs font-semibold text-gray-400 uppercase tracking-widest mb-3">Library</p>

<div class="space-y-2">
  {% for group, doc_count in groups %}
  <a href="/library/{{ group.id }}"
    class="flex items-center justify-between {{ alpha_bg(group.name) }} rounded-2xl px-4 py-3.5 shadow-sm active:scale-95 transition-transform">
    <span class="font-semibold">{{ group.name }}</span>
    <span class="text-xs opacity-50">{{ doc_count }}</span>
  </a>
  {% endfor %}
</div>

{% endblock %}
