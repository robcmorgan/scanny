{% if groups %}
<div class="space-y-2 mb-3">
  {% for group in groups %}
  <button
    hx-get="/groups/{{ group.id }}/recent-subgroups"
    hx-target="#subgroup-modal-content"
    hx-on::after-request="openSubgroupSheet()"
    class="w-full text-left {{ chip_color(group.name) }} rounded-2xl px-4 py-3.5 font-semibold shadow-sm active:scale-95 transition-transform">
    {{ group.name }}
  </button>
  {% endfor %}
</div>
{% endif %}
<div class="space-y-2 mt-2">
  {% for sub in subgroups %}
  <button
    data-subgroup-id="{{ sub.id }}"
    data-label="{{ sub.group.name }} / {{ sub.name }}"
    data-group-name="{{ sub.group.name }}"
    data-subgroup-name="{{ sub.name }}"
    data-filename-tag="{{ sub.filename_tag or '' }}"
    data-include-group="{{ 'true' if sub.group.include_in_path else 'false' }}"
    onclick="selectSubgroupFromEl(this)"
    class="w-full text-left rounded-2xl shadow-sm active:scale-95 transition-transform overflow-hidden block {{ chip_color(sub.group.name + '/' + sub.name) }}"
  >
    <span class="block px-4 pt-2.5 pb-1">
      <span class="inline-flex items-center gap-1 text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full {{ chip_color(sub.group.name) }}">
        <svg class="w-2.5 h-2.5 opacity-70 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z"/>
        </svg>
        {{ sub.group.name }}
      </span>
    </span>
    <span class="font-semibold block px-4 pb-2.5">{{ sub.name }}</span>
  </button>
  {% endfor %}
  {% if not subgroups and not groups %}
  <p class="text-gray-400 py-4 text-center text-sm">No matches</p>
  {% endif %}
</div>
